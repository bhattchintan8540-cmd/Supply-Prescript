<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SupplyPrescript</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>SupplyPrescript</h1>
    <p class="tagline">Predict the delay. Prescribe the fix. Track whether it actually worked.</p>
  </header>

  <main>
    <section id="shipment-form-section">
      <h2>1. Shipment details</h2>
      <form id="shipment-form">
        <div class="grid">
          <label>SKU
            <input name="sku" value="MICROCHIP-A2" required />
          </label>
          <label>Supplier
            <input name="supplier" value="NovaChip Manufacturing" required />
          </label>
          <label>Origin region
            <select name="origin_region">
              <option>Asia Pacific</option>
              <option>Europe</option>
              <option>North America</option>
            </select>
          </label>
          <label>Distance (km)
            <input name="distance_km" type="number" value="8800" required />
          </label>
          <label>Historical avg lead time (days)
            <input name="historical_avg_lead_time_days" type="number" value="16" required />
          </label>
          <label>Order quantity
            <input name="order_quantity" type="number" value="6000" required />
          </label>
          <label>Unit cost (USD)
            <input name="unit_cost_usd" type="number" step="0.01" value="14.2" required />
          </label>
          <label>Peak season?
            <input name="is_peak_season" type="checkbox" />
          </label>
          <label>Budget cap (USD)
            <input name="budget_cap_usd" type="number" value="95000" />
          </label>
          <label>Max acceptable delay (days)
            <input name="max_acceptable_delay_days" type="number" value="5" />
          </label>
        </div>
        <button type="submit">Get prescription</button>
      </form>
    </section>

    <section id="prediction-section" hidden>
      <h2>2. What the model expects</h2>
      <p id="prediction-summary"></p>
    </section>

    <section id="options-section" hidden>
      <h2>3. Prescribed options</h2>
      <div id="options-cards" class="cards"></div>
    </section>

    <section id="roi-section">
      <h2>4. Decision ROI (closed loop)</h2>
      <button id="refresh-roi">Refresh</button>
      <div id="roi-summary"></div>
      <table id="decisions-table">
        <thead>
          <tr>
            <th>ID</th><th>SKU</th><th>Chosen option</th><th>Predicted $</th>
            <th>Actual $</th><th>Status</th><th>Log outcome</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
